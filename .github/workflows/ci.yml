name: METIS verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ml-api/requirements*.txt
      - run: pip install -r requirements-dev.txt -c requirements.lock.txt
      - run: python -m pytest -q
  java-and-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: docker info
      - run: mvn -B -ntp -f backend/spring-boot/pom.xml verify
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated CI credentials
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> .env
      - run: docker compose config --quiet
      - run: docker compose --parallel 1 build
      - run: docker compose up -d --wait --wait-timeout 240
      - run: python infrastructure/scripts/smoke.py --restart-database
      - name: Diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail 80
      - name: Shut down ephemeral CI stack
        if: always()
        run: docker compose down
