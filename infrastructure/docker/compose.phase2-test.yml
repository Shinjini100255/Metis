# Isolated fixture-only stack. Start with both Compose files and -p metis-phase2-test.
# No market credential, no live requests, separate database/artifact volumes and ports.
services:
  postgres:
    environment:
      POSTGRES_DB: metis_phase2_test
      POSTGRES_USER: metis_test
      POSTGRES_PASSWORD: isolated-fixtures-only
  ml-api:
    image: metis-ml-api:latest
    ports: !override
      - "127.0.0.1:18000:8000"
    environment:
      METIS_ALLOW_FIXTURES: "true"
  spring-backend:
    image: metis-spring-backend:latest
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/metis_phase2_test
      POSTGRES_USER: metis_test
      POSTGRES_PASSWORD: isolated-fixtures-only
      ALPHA_VANTAGE_API_KEY: ""
      LIVE_INGESTION_ENABLED: "false"
      METIS_ALLOW_FIXTURES: "true"
  frontend:
    image: metis-frontend:latest
    ports: !override
      - "127.0.0.1:15173:8080"
